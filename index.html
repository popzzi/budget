<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예산 관리 시스템</title>
    <style>
        /* 브라우저 기본 여백 제거 및 전체 화면 설정 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 스크롤바 방지 */
        }

        /* iframe을 화면 전체에 맞추고 테두리 제거 */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbwnTwGrg_hGolidCkFiRg7sZDyqnwtrz-LlA5mvyzzomyDZ5mrW0YRszBxnNRVyyqz1cQ/exec" 
            allow="camera; microphone; clipboard-read; clipboard-write">
    </iframe>

</body>
</html>
